name: Desktop and package checks

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distribution: ["ubuntu:22.04", "ubuntu:24.04", "debian:12", "debian:13"]
    container: ${{ matrix.distribution }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 python3-gi python3-cairo python3-gi-cairo gir1.2-gtk-3.0 gir1.2-vte-2.91 gir1.2-ayatanaappindicator3-0.1 xvfb xauth dbus-x11 at-spi2-core librsvg2-common shared-mime-info fonts-dejavu-core adwaita-icon-theme desktop-file-utils shellcheck dpkg-dev
      - name: Test offline desktop flows and Debian package
        run: dbus-run-session -- xvfb-run -a ./scripts/check.sh
      - name: Install desktop from one Debian package and switch editions
        env:
          OPENVPN3_PACKAGE_TEST_CONTAINER: "1"
        run: ./scripts/package-install-smoke.sh desktop

  headless:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distribution: ["ubuntu:24.04", "debian:13"]
    container: ${{ matrix.distribution }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install server test dependencies without desktop libraries
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 python3-gi dpkg-dev
      - name: Build and install the server package in isolation
        env:
          OPENVPN3_PACKAGE_TEST_CONTAINER: "1"
        run: |
          ./scripts/build-deb.sh
          ./scripts/package-install-smoke.sh headless
